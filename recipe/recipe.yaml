schema_version: 1

context:
  name: unstructured-client
  version: 0.47.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 10f2293fc6ad8d196bc72f46ef9b91a1acdc46d0318f5e302859cd5692cbdec3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry
  run:
    - pypdfium2 >=5.6.0
    - httpcore >=1.0.9
    - aiofiles >=25.1.0
    - pydantic >=2.12.5
    - httpx >=0.28.1
    - requests-toolbelt >=1.0.0
    - python >=${{ python_min }}
    - pypdf >=6.9.2
    - certifi >=2026.10.19
tests:
  - python:
      imports:
        - unstructured_client
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Python Client SDK for Unstructured API
  license: MIT
  license_file: LICENSE.md
  homepage: https://github.com/Unstructured-IO/unstructured-python-client

extra:
  recipe-maintainers:
    - jan-janssen
